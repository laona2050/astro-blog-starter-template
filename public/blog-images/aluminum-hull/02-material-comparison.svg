<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">四种船体材料综合对比</text>
  <text x="500" y="78" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">铝合金 vs 钢 vs 玻璃钢（FRP）vs 碳纤维</text>
  
  <!-- Comparison bars - Weight -->
  <text x="120" y="130" font-family="Arial, sans-serif" font-size="16" fill="#8899aa">重量（越低越好）</text>
  
  <rect x="280" y="112" width="120" height="24" rx="4" fill="#4fc3f7" filter="url(#shadow)"/>
  <text x="285" y="129" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">铝 2.7 g/cm³</text>
  
  <rect x="420" y="112" width="300" height="24" rx="4" fill="#78909c" filter="url(#shadow)"/>
  <text x="430" y="129" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">钢 7.85 g/cm³</text>
  
  <rect x="280" y="142" width="180" height="24" rx="4" fill="#66bb6a" filter="url(#shadow)"/>
  <text x="285" y="159" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">玻璃钢 1.5-2.0</text>
  
  <rect x="280" y="172" width="130" height="24" rx="4" fill="#ab47bc" filter="url(#shadow)"/>
  <text x="285" y="189" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">碳纤维 1.5-1.6</text>
  
  <!-- Comparison bars - Strength -->
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="16" fill="#8899aa">强度（越高越好）</text>
  
  <rect x="280" y="232" width="200" height="24" rx="4" fill="#4fc3f7" filter="url(#shadow)"/>
  <text x="285" y="249" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">铝 200-350 MPa</text>
  
  <rect x="280" y="262" width="260" height="24" rx="4" fill="#78909c" filter="url(#shadow)"/>
  <text x="285" y="279" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">钢 235-355 MPa</text>
  
  <rect x="280" y="292" width="160" height="24" rx="4" fill="#66bb6a" filter="url(#shadow)"/>
  <text x="285" y="309" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">FRP 100-300</text>
  
  <rect x="280" y="322" width="380" height="24" rx="4" fill="#ab47bc" filter="url(#shadow)"/>
  <text x="285" y="339" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">碳纤维 1500-3500 MPa ★</text>
  
  <!-- Comparison bars - Corrosion -->
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="16" fill="#8899aa">耐腐蚀性（越高越好）</text>
  
  <rect x="280" y="382" width="260" height="24" rx="4" fill="#4fc3f7" filter="url(#shadow)"/>
  <text x="285" y="399" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">铝 ★★★★★</text>
  
  <rect x="280" y="412" width="60" height="24" rx="4" fill="#78909c" filter="url(#shadow)"/>
  <text x="285" y="429" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">钢 ★</text>
  
  <rect x="280" y="442" width="220" height="24" rx="4" fill="#66bb6a" filter="url(#shadow)"/>
  <text x="285" y="459" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">FRP ★★★★</text>
  
  <rect x="280" y="472" width="240" height="24" rx="4" fill="#ab47bc" filter="url(#shadow)"/>
  <text x="285" y="489" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">碳纤维 ★★★★</text>
  
  <!-- Cost comparison -->
  <text x="120" y="540" font-family="Arial, sans-serif" font-size="16" fill="#8899aa">20年总持有成本</text>
  
  <rect x="280" y="522" width="180" height="24" rx="4" fill="#4fc3f7" filter="url(#shadow)"/>
  <text x="285" y="539" font-family="Arial, sans-serif" font-size="12" fill="#0d1b2a" font-weight="bold">铝 $200万 ✓ 最低</text>
  
  <rect x="280" y="552" width="240" height="24" rx="4" fill="#78909c" filter="url(#shadow)"/>
  <text x="285" y="569" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">钢 ~$220万</text>
  
  <!-- Winner badge -->
  <g transform="translate(720, 200)">
    <rect x="0" y="0" width="220" height="160" rx="15" fill="#4fc3f7" opacity="0.15" stroke="#4fc3f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="110" y="35" font-family="Arial, sans-serif" font-size="18" fill="#4fc3f7" text-anchor="middle" font-weight="bold">🏆 综合冠军</text>
    <text x="110" y="65" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">铝合金</text>
    <text x="110" y="90" font-family="Arial, sans-serif" font-size="13" fill="#8899aa" text-anchor="middle">在所有维度上</text>
    <text x="110" y="108" font-family="Arial, sans-serif" font-size="13" fill="#8899aa" text-anchor="middle">取得最佳平衡</text>
    <text x="110" y="135" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">不是单项最强</text>
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">但综合最优 ✓</text>
  </g>
  
  <!-- Bottom -->
  <rect x="0" y="580" width="1000" height="20" fill="#0d1b2a" opacity="0.8"/>
  <text x="500" y="594" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">老鹏友的航海日志 | homesh.top</text>
</svg>
