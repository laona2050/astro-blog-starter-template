<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c8d0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a9aaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0a2a4a;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Sky glow -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>
  
  <!-- Sun -->
  <circle cx="950" cy="120" r="50" fill="#ff8c42" opacity="0.6" filter="url(#glow)"/>
  <circle cx="950" cy="120" r="35" fill="#ffb347" opacity="0.8"/>
  
  <!-- Water -->
  <rect x="0" y="380" width="1200" height="250" fill="url(#water)"/>
  
  <!-- Waves -->
  <path d="M0 400 Q150 380 300 400 Q450 420 600 400 Q750 380 900 400 Q1050 420 1200 400 L1200 410 Q1050 430 900 410 Q750 390 600 410 Q450 430 300 410 Q150 390 0 410 Z" fill="#1a5276" opacity="0.5"/>
  <path d="M0 430 Q150 415 300 430 Q450 445 600 430 Q750 415 900 430 Q1050 445 1200 430 L1200 440 Q1050 455 900 440 Q750 425 600 440 Q450 455 300 440 Q150 425 0 440 Z" fill="#154360" opacity="0.4"/>
  <path d="M0 460 Q200 445 400 460 Q600 475 800 460 Q1000 445 1200 460 L1200 470 Q1000 485 800 470 Q600 485 400 470 Q200 455 0 470 Z" fill="#0e2f44" opacity="0.3"/>
  
  <!-- Hull (aluminum boat cross-section) -->
  <g transform="translate(350, 250)" filter="url(#shadow)">
    <!-- Main hull body -->
    <path d="M50 120 L200 0 L300 0 L450 120 L400 130 L100 130 Z" fill="url(#hull)" stroke="#5a6a7a" stroke-width="2"/>
    <!-- Deck -->
    <path d="M180 0 L200 0 L300 0 L320 0 L310 -15 L190 -15 Z" fill="#d0d8e0" stroke="#5a6a7a" stroke-width="1.5"/>
    <!-- Cabin -->
    <rect x="200" y="-60" width="100" height="45" fill="#e0e8f0" stroke="#5a6a7a" stroke-width="1.5" rx="3"/>
    <!-- Windows -->
    <rect x="210" y="-50" width="35" height="25" fill="#87CEEB" opacity="0.7" rx="2"/>
    <rect x="255" y="-50" width="35" height="25" fill="#87CEEB" opacity="0.7" rx="2"/>
    <!-- Rivets/weld lines -->
    <line x1="150" y1="30" x2="350" y2="30" stroke="#5a6a7a" stroke-width="0.8" stroke-dasharray="4,3"/>
    <line x1="120" y1="60" x2="380" y2="60" stroke="#5a6a7a" stroke-width="0.8" stroke-dasharray="4,3"/>
    <line x1="100" y1="90" x2="400" y2="90" stroke="#5a6a7a" stroke-width="0.8" stroke-dasharray="4,3"/>
    <!-- Hull label -->
    <text x="250" y="80" font-family="Arial, sans-serif" font-size="14" fill="#3a4a5a" text-anchor="middle" font-weight="bold">Al 5083</text>
  </g>
  
  <!-- Water reflection -->
  <ellipse cx="600" cy="420" rx="200" ry="15" fill="#87CEEB" opacity="0.1"/>
  <ellipse cx="600" cy="450" rx="150" ry="10" fill="#87CEEB" opacity="0.08"/>
  
  <!-- Title text -->
  <text x="600" y="140" font-family="Arial, sans-serif" font-size="52" fill="white" text-anchor="middle" font-weight="bold" filter="url(#glow)">铝合金船体优势</text>
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="24" fill="#a0c4e8" text-anchor="middle">为什么顶级游艇都在用铝？深度调研</text>
  
  <!-- Key stats -->
  <g transform="translate(80, 500)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#ffffff" opacity="0.1" filter="url(#shadow)"/>
    <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" fill="#4fc3f7" text-anchor="middle" font-weight="bold">1/3</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#a0c4e8" text-anchor="middle">钢的重量</text>
  </g>
  
  <g transform="translate(260, 500)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#ffffff" opacity="0.1" filter="url(#shadow)"/>
    <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" fill="#81c784" text-anchor="middle" font-weight="bold">40-50年</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#a0c4e8" text-anchor="middle">使用寿命</text>
  </g>
  
  <g transform="translate(440, 500)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#ffffff" opacity="0.1" filter="url(#shadow)"/>
    <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" fill="#ffb74d" text-anchor="middle" font-weight="bold">20-30%</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#a0c4e8" text-anchor="middle">油耗降低</text>
  </g>
  
  <g transform="translate(620, 500)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#ffffff" opacity="0.1" filter="url(#shadow)"/>
    <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" fill="#e57373" text-anchor="middle" font-weight="bold">23%</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#a0c4e8" text-anchor="middle">持有成本更低</text>
  </g>
  
  <g transform="translate(800, 500)">
    <rect x="0" y="0" width="140" height="80" rx="10" fill="#ffffff" opacity="0.1" filter="url(#shadow)"/>
    <text x="70" y="35" font-family="Arial, sans-serif" font-size="32" fill="#ce93d8" text-anchor="middle" font-weight="bold">&gt;90%</text>
    <text x="70" y="60" font-family="Arial, sans-serif" font-size="12" fill="#a0c4e8" text-anchor="middle">可回收率</text>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#0a1628" opacity="0.8"/>
  <text x="600" y="620" font-family="Arial, sans-serif" font-size="13" fill="#5a7a9a" text-anchor="middle">老鹏友的航海日志 | homesh.top</text>
</svg>
