<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">行业案例：谁在选铝合金？</text>
  <text x="500" y="65" font-family="Arial, sans-serif" font-size="13" fill="#8899aa" text-anchor="middle">顶级游艇品牌的选择说明了什么</text>
  
  <!-- Aquila -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#1a3a5c" stroke="#4fc3f7" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="20" fill="#4fc3f7" opacity="0.2"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" fill="#4fc3f7" text-anchor="middle" font-weight="bold">⛵</text>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Aquila</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="11" fill="#8899aa">全球最大铝制动力双体船厂</text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">船型：46 / 47 / 50 / 54 尺</text>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">材料：全铝合金</text>
    <text x="20" y="121" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">逻辑：最佳强度-重量比</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#66bb6a">✓ 跑得快、装得多、维护少</text>
  </g>
  
  <!-- Sunreef -->
  <g transform="translate(350, 95)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#1a3a5c" stroke="#ffa726" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="20" fill="#ffa726" opacity="0.2"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" fill="#ffa726" text-anchor="middle" font-weight="bold">🚢</text>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Sunreef</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="11" fill="#8899aa">超级双体游艇领导者</text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">船型：60-80 尺动力双体</text>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">材料：钢船体 + 铝上层建筑</text>
    <text x="20" y="121" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">逻辑：大尺寸混合结构</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#66bb6a">✓ 关键部位用钢，减重用铝</text>
  </g>
  
  <!-- Nordhavn -->
  <g transform="translate(670, 95)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="#1a3a5c" stroke="#ab47bc" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="30" cy="30" r="20" fill="#ab47bc" opacity="0.2"/>
    <text x="30" y="36" font-family="Arial, sans-serif" font-size="18" fill="#ab47bc" text-anchor="middle" font-weight="bold">🌊</text>
    <text x="60" y="25" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="bold">Nordhavn</text>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="11" fill="#8899aa">环球探险船标杆</text>
    
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">船型：50+ 尺探险船</text>
    <text x="20" y="98" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">材料：钢制（>50尺例外）</text>
    <text x="20" y="121" font-family="Arial, sans-serif" font-size="13" fill="#a0c4e8">逻辑：超大尺寸需更高强度</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="11" fill="#ffa726">⚠ 大尺寸用钢，中型用铝</text>
  </g>
  
  <!-- Decision matrix -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="940" height="210" rx="12" fill="#0d1b2a" stroke="#5a7a9a" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="470" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">📊 购船决策矩阵</text>
    
    <!-- Header row -->
    <rect x="15" y="45" width="120" height="28" rx="4" fill="#1a3a5c"/>
    <text x="75" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4fc3f7" text-anchor="middle" font-weight="bold">船尺寸</text>
    
    <rect x="135" y="45" width="120" height="28" rx="4" fill="#1a3a5c"/>
    <text x="195" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4fc3f7" text-anchor="middle" font-weight="bold">预算</text>
    
    <rect x="255" y="45" width="120" height="28" rx="4" fill="#1a3a5c"/>
    <text x="315" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4fc3f7" text-anchor="middle" font-weight="bold">使用期限</text>
    
    <rect x="375" y="45" width="120" height="28" rx="4" fill="#1a3a5c"/>
    <text x="435" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4fc3f7" text-anchor="middle" font-weight="bold">推荐材料</text>
    
    <rect x="495" y="45" width="430" height="28" rx="4" fill="#1a3a5c"/>
    <text x="710" y="64" font-family="Arial, sans-serif" font-size="12" fill="#4fc3f7" text-anchor="middle" font-weight="bold">理由</text>
    
    <!-- Row 1 -->
    <rect x="15" y="78" width="120" height="28" rx="4" fill="#111827"/>
    <text x="75" y="97" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">&lt; 30 尺</text>
    <rect x="135" y="78" width="120" height="28" rx="4" fill="#111827"/>
    <text x="195" y="97" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">低</text>
    <rect x="255" y="78" width="120" height="28" rx="4" fill="#111827"/>
    <text x="315" y="97" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">短期</text>
    <rect x="375" y="78" width="120" height="28" rx="4" fill="#2e7d32"/>
    <text x="435" y="97" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">玻璃钢 ✅</text>
    <rect x="495" y="78" width="430" height="28" rx="4" fill="#111827"/>
    <text x="710" y="97" font-family="Arial, sans-serif" font-size="11" fill="#a0c4e8" text-anchor="middle">小尺寸玻璃钢性价比最高，短期持有看初始成本</text>
    
    <!-- Row 2 -->
    <rect x="15" y="111" width="120" height="28" rx="4" fill="#111827"/>
    <text x="75" y="130" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">30-50 尺</text>
    <rect x="135" y="111" width="120" height="28" rx="4" fill="#111827"/>
    <text x="195" y="130" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">中</text>
    <rect x="255" y="111" width="120" height="28" rx="4" fill="#111827"/>
    <text x="315" y="130" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">中长期</text>
    <rect x="375" y="111" width="120" height="28" rx="4" fill="#1565c0"/>
    <text x="435" y="130" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">铝合金 ✅</text>
    <rect x="495" y="111" width="430" height="28" rx="4" fill="#111827"/>
    <text x="710" y="130" font-family="Arial, sans-serif" font-size="11" fill="#a0c4e8" text-anchor="middle">铝的优势开始显现，轻量化+低维护+长寿命</text>
    
    <!-- Row 3 -->
    <rect x="15" y="144" width="120" height="28" rx="4" fill="#111827"/>
    <text x="75" y="163" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">50-80 尺</text>
    <rect x="135" y="144" width="120" height="28" rx="4" fill="#111827"/>
    <text x="195" y="163" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">中高</text>
    <rect x="255" y="144" width="120" height="28" rx="4" fill="#111827"/>
    <text x="315" y="163" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">长期</text>
    <rect x="375" y="144" width="120" height="28" rx="4" fill="#1565c0"/>
    <text x="435" y="163" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">铝合金 ✅</text>
    <rect x="495" y="144" width="430" height="28" rx="4" fill="#111827"/>
    <text x="710" y="163" font-family="Arial, sans-serif" font-size="11" fill="#a0c4e8" text-anchor="middle">尺寸越大铝的优势越明显，20年总成本低23%</text>
    
    <!-- Row 4 -->
    <rect x="15" y="177" width="120" height="28" rx="4" fill="#111827"/>
    <text x="75" y="196" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">&gt; 80 尺</text>
    <rect x="135" y="177" width="120" height="28" rx="4" fill="#111827"/>
    <text x="195" y="196" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">高</text>
    <rect x="255" y="177" width="120" height="28" rx="4" fill="#111827"/>
    <text x="315" y="196" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">长期</text>
    <rect x="375" y="177" width="120" height="28" rx="4" fill="#e65100"/>
    <text x="435" y="196" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">钢+铝混合 ✅</text>
    <rect x="495" y="177" width="430" height="28" rx="4" fill="#111827"/>
    <text x="710" y="196" font-family="Arial, sans-serif" font-size="11" fill="#a0c4e8" text-anchor="middle">超大尺寸钢保证强度，上层铝减重，综合最优</text>
  </g>
  
  <!-- Bottom -->
  <rect x="0" y="480" width="1000" height="20" fill="#0d1b2a" opacity="0.8"/>
  <text x="500" y="494" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">老鹏友的航海日志 | homesh.top</text>
</svg>
