<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2838;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d8e0" />
      <stop offset="100%" style="stop-color:#7a8a9a" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4fc3f7"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" fill="white" text-anchor="middle" font-weight="bold">铝合金船体防腐体系</text>
  <text x="500" y="65" font-family="Arial, sans-serif" font-size="13" fill="#8899aa" text-anchor="middle">四层防护 = 40-50 年使用寿命</text>
  
  <!-- Hull cross section -->
  <g transform="translate(300, 100)">
    <!-- Hull plate -->
    <path d="M50 150 L150 50 L350 50 L450 150 L420 160 L80 160 Z" fill="url(#hull)" stroke="#5a6a7a" stroke-width="2" filter="url(#shadow)"/>
    <!-- Weld lines -->
    <line x1="100" y1="80" x2="400" y2="80" stroke="#4a5a6a" stroke-width="1" stroke-dasharray="5,3"/>
    <line x1="90" y1="110" x2="410" y2="110" stroke="#4a5a6a" stroke-width="1" stroke-dasharray="5,3"/>
    <!-- Label -->
    <text x="250" y="105" font-family="Arial, sans-serif" font-size="16" fill="#3a4a5a" text-anchor="middle" font-weight="bold">Al 5083 船体板</text>
    
    <!-- Layer 1: Oxide film -->
    <rect x="0" y="165" width="500" height="30" rx="5" fill="#e3f2fd" stroke="#4fc3f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="250" y="185" font-family="Arial, sans-serif" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">① 自然氧化膜 Al₂O₃（2-3纳米，自修复）</text>
    
    <!-- Layer 2: Anti-fouling -->
    <rect x="0" y="200" width="500" height="30" rx="5" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="250" y="220" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">② 防污漆（Anti-fouling，每2-3年重涂）</text>
    
    <!-- Layer 3: Sacrificial anode -->
    <g transform="translate(50, 240)">
      <rect x="0" y="0" width="400" height="30" rx="5" fill="#fff3e0" stroke="#ffa726" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="200" y="20" font-family="Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="bold">③ 牺牲阳极（锌/铝阳极，每1-2年更换）</text>
      <!-- Anode block -->
      <rect x="420" y="-10" width="60" height="50" rx="3" fill="#9e9e9e" stroke="#757575" stroke-width="1"/>
      <text x="450" y="18" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Zn</text>
    </g>
    
    <!-- Layer 4: Cathodic protection -->
    <rect x="0" y="280" width="500" height="30" rx="5" fill="#fce4ec" stroke="#ec407a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="250" y="300" font-family="Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="bold">④ 阴极保护 ICCP（大型船可选，一次性安装）</text>
  </g>
  
  <!-- Corrosion rate comparison -->
  <g transform="translate(720, 120)">
    <text x="120" y="0" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">海水腐蚀速率对比</text>
    
    <!-- Steel bar -->
    <rect x="0" y="25" width="200" height="28" rx="4" fill="#78909c"/>
    <text x="100" y="44" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">钢 100%</text>
    
    <!-- Aluminum bar -->
    <rect x="0" y="60" width="20" height="28" rx="4" fill="#4fc3f7"/>
    <text x="35" y="79" font-family="Arial, sans-serif" font-size="13" fill="#4fc3f7" text-anchor="middle" font-weight="bold">铝 ~10%</text>
    
    <!-- Lifetime comparison -->
    <text x="120" y="130" font-family="Arial, sans-serif" font-size="12" fill="#8899aa" text-anchor="middle">使用寿命</text>
    
    <rect x="0" y="140" width="120" height="24" rx="4" fill="#78909c"/>
    <text x="60" y="157" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">钢 20-30年</text>
    
    <rect x="0" y="170" width="240" height="24" rx="4" fill="#4fc3f7"/>
    <text x="120" y="187" font-family="Arial, sans-serif" font-size="11" fill="#0d1b2a" font-weight="bold" text-anchor="middle">铝 40-50年 ★</text>
  </g>
  
  <!-- Bottom -->
  <rect x="0" y="480" width="1000" height="20" fill="#0d1b2a" opacity="0.8"/>
  <text x="500" y="494" font-family="Arial, sans-serif" font-size="11" fill="#5a7a9a" text-anchor="middle">老鹏友的航海日志 | homesh.top</text>
</svg>
